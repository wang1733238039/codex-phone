map $http_upgrade $codex_phone_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 308 https://your-domain.example$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.example;
    ssl_certificate /etc/letsencrypt/live/your-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:codex_phone_ssl:1m;
    ssl_session_timeout 1d;
    client_max_body_size 256k;
    access_log /var/log/nginx/codex-phone.access.log;
    error_log /var/log/nginx/codex-phone.error.log;
    location / {
        proxy_pass http://127.0.0.1:3819;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $codex_phone_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }
}
