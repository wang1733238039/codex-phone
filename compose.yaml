services:
  phone:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    expose:
      - "3819"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PHONE_DOMAIN: ${PHONE_DOMAIN:?Set PHONE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - phone
volumes:
  caddy_data:
  caddy_config:
